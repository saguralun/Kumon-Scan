function getStudyStatus({
  value,
  warning,
  danger,
  baseClass,
  blink = false,
}) {

  let cardClass =
    baseClass;

  let badgeHTML =
    "";

  if (value >= danger) {

    cardClass +=
      " overDanger";

    badgeHTML =
      `<span class="badge red ${
        blink
          ? "blink"
          : ""
      }">
        ${STUDY_LIMIT.danger}+
      </span>`;

  } else if (
    value >= warning
  ) {

    cardClass +=
      " overWarning";

    badgeHTML =
      `<span class="badge orange">
        ${STUDY_LIMIT.warning}+
      </span>`;
  }

  return {
    cardClass,
    badgeHTML,
  };

}

function getProgressInfo(
  seconds
) {

  let percent = 0;
  let color =
    "#4CAF50";

  if (
    seconds <= warningSecond
  ) {

    percent =
      (seconds / warningSecond)
      * 100;

  } else if (
    seconds <= dangerSecond
  ) {

    percent =
      (
        (seconds - warningSecond)
        /
        (
          dangerSecond -
          warningSecond
        )
      ) * 100;

    color =
      "#fb8c00";

  } else {

    percent = 100;
    color =
      "#e53935";

  }

  return {
    percent,
    color,
  };

}

function getStatsByMinutes(
  list,
  getMinutes
) {

  let warning = 0;
  let danger = 0;

  list.forEach((item) => {

    const min =
      getMinutes(item);

    if (min == null)
      return;

    if (
      min >=
      STUDY_LIMIT.danger
    ) {

      danger++;

    } else if (
      min >=
      STUDY_LIMIT.warning
    ) {

      warning++;

    }

  });

  return {
    total:
      list.length,
    warning,
    danger,
  };

}

function getActiveStudentItems(
  subject =
    currentSubject,
  now =
    new Date()
) {

  return activeDataAll
    .filter(
      item =>
        item.subject === subject
    )
    .filter(
      item =>
        !checkoutState.pending.has(
          item.id
        )
    )
    .map((item) => {

      const checkIn =
        item.checkInTime.toDate();

      const seconds =
        Math.max(
          0,
          Math.floor(
            (now - checkIn) / 1000
          )
        );

      return {
        item,
        checkIn,
        seconds,
        minutes:
          Math.floor(seconds / 60) || 0,
      };

    });

}

function renderQueue() {

        </div>
      `,
      });

    });

  // Recent Check-in
  activityState.checkinQueue
    
    .filter(
      item =>
        item.subject === currentSubject
    )  

    .forEach(item => {

      entries.push({
        timeMs:
          getActivityTimeMs(
            item.time
          ),

        html: `
        <div class="checkout-toast">
          ➡️ ${formatFirestoreTime(item.time)} ${escapeHtml(item.nickname)}
        </div>
      `,
      });

  });

  // Recent Check-out
  activityState.checkoutQueue
  
    .filter(
      item =>
        item.subject === currentSubject
    )
    
    .forEach(item => {

      entries.push({
        timeMs:
          getActivityTimeMs(
            item.time
          ),

        html: `
        <div class="checkout-toast">
          ⬅️ ${formatFirestoreTime(item.time)} ${escapeHtml(item.nickname)}
        </div>
      `,
      });

    });

  entries.sort(
    (a, b) =>
      (b.priority || 0) - (a.priority || 0) || b.timeMs - a.timeMs
  );

  const visibleEntries =
    entries.slice(
      0,
      ACTIVITY_CONFIG.maxItems
    );

  const hiddenCount =
    entries.length -
    visibleEntries.length;

  let html =
    visibleEntries
      .map(
        entry =>
          entry.html
      )
      .join("");

  if (
    hiddenCount > 0
  ) {
    html += `
      <div class="checkout-toast checkout-toast-more">
        +${hiddenCount} รายการ
      </div>
    `;
  }

  el.innerHTML = html;
}

function getActivityTimeMs(
  time
) {

  if (
    time instanceof Date
  ) {
    return time.getTime();
  }

  if (
    time?.toDate
  ) {
    return time.toDate().getTime();
  }

  return Date.now();

}

// ======================
// Checkout Helpers
// ======================
function addPendingCheckout(
  id,
  nickname
) {
  const snapshot = activeDataAll.find(item => item.id === id);
  let saved = checkoutStore.get(id);
  if (!saved) {
    const { studentId, subject, date, slotKey, firstName, lastName } = snapshot;
    saved = { version: 1, id, requestId: crypto.randomUUID(), createdAt: Date.now(),
      nickname, requestedAt: new Date().toISOString(), status: "pending",
      attendanceData: { id, studentId, subject, date, slotKey, nickname,
        firstName: firstName || "", lastName: lastName || "",
        checkInTime: snapshot.checkInTime.toDate().toISOString() },
    };
    checkoutStore.put(saved);
  }

  // hide from active list
  checkoutState.pending.add(id);

  // show in checkout queue
  checkoutState.queue.set(
    id,
    {
      nickname,
      startedAt: saved.createdAt,
      requestedAt: new Date(saved.requestedAt),
      durable: true,
      failed: false,
    }
  );

  renderAll();

}

function confirmCheckout(id) {
  try { checkoutStore.remove(id); } catch (error) { console.warn("Could not remove confirmed local checkout", error); }
  // Keep hiding stale active snapshots until the server confirms removal.
  checkoutState.confirmed.add(id);
  checkoutState.queue.delete(id);
  activeDataAll = activeDataAll.filter(item => item.id !== id);
}

function restorePendingCheckouts() {
  try {
    const jobs = checkoutStore.list();
    const ids = new Set(jobs.map(job => job.id));
    for (const [id, entry] of checkoutState.queue) {
      if (entry.durable && !ids.has(id) && !checkoutState.loading.has(id)) confirmCheckout(id);
    }
    for (const job of jobs) {
      if (checkoutState.loading.has(job.id)) continue;
      const attendanceData = { ...job.attendanceData,
        checkInTime: Timestamp.fromDate(new Date(job.attendanceData.checkInTime)),
      };
      checkoutState.pending.add(job.id);
      checkoutState.queue.set(job.id, { nickname: job.nickname, durable: true,
        startedAt: job.createdAt, requestedAt: new Date(job.requestedAt),
        failed: job.status === "failed", attendanceData,
      });
      if (job.status !== "failed") void processCheckout(job.id, attendanceData);
    }
    renderAll();
  } catch (error) { console.error("Could not restore checkout queue", error); }
}

function reconcileConfirmedCheckouts(snapshot) {
  if (snapshot.metadata.fromCache || snapshot.metadata.hasPendingWrites) return;

  const activeIds = new Set(snapshot.docs.map(item => item.id));
  for (const id of checkoutState.confirmed) {
    if (!activeIds.has(id)) {
      checkoutState.pending.delete(id);
      checkoutState.confirmed.delete(id);
    }
  }
}

function waitForCheckoutRetry(delay) {
  return new Promise(resolve => {
    const finish = () => {
      clearTimeout(timer);
      window.removeEventListener("online", finish);
      resolve();
    };
    const timer = setTimeout(finish, delay);
    window.addEventListener("online", finish, { once: true });
  });
}

function addRecentCheckin({
  nickname,
  subject,
  time,
}) {

  activityState.checkinQueue.unshift({
    nickname,
    subject,
    time,
    expireAt:
      Date.now() +
      ACTIVITY_CONFIG.recentCheckinMinutes * 60 * 1000
  });

}

function addRecentCheckout({
  nickname,
  subject,
  time,
}) {

  activityState.checkoutQueue.unshift({
    nickname,
    subject,
    time,
    expireAt:
      Date.now() +
      ACTIVITY_CONFIG.recentCheckoutMinutes * 60 * 1000
  });

}

function cleanupActivityQueue() {

  const now = Date.now();

  activityState.checkinQueue =
    activityState.checkinQueue.filter(
      item => item.expireAt > now
    );

  activityState.checkoutQueue =
    activityState.checkoutQueue.filter(
      item => item.expireAt > now
    );

}

        <div class="kpi-card orange">
          <div class="kpi-number">${completedStats.warning}</div>
          <div class="kpi-label">เกิน ${STUDY_LIMIT.warning} นาที</div>
        </div>

        <div class="kpi-card red">
          <div class="kpi-number">${completedStats.danger}</div>
          <div class="kpi-label">เกิน ${STUDY_LIMIT.danger} นาที</div>
        </div>

      </div>
    `;
  }
}

function renderActiveControls() {

  const subjectTabs =
    $("subjectTabs");

  if (
    !subjectTabs
  ) {
    return;
  }

  const isActive =
    currentTab === "active";

  subjectTabs.style.display =
    isActive
      ? ""
      : "none";

  const subjectCounts = {};

  ["ME", "EFL", "TRP"]
    .forEach((subject) => {

      subjectCounts[subject] =
        getActiveStudentItems(
          subject
        ).length;

    });

  document
    .querySelectorAll(
      ".sub-btn"
    )
    .forEach((btn) => {

      const subject =
        btn.dataset.subject;

      btn.innerHTML =
        `<span>${subjectIconMap[subject]} ${subject}</span>
         <strong>${subjectCounts[subject] || 0}</strong>`;

    });

}

// load attendance ที่เป็น completed ของวันนี้
async function loadCompleted() {
  const requestVersion = ++completedRequestVersion;
  const date = currentDate;
  completedLoading = true;
  completedError = false;
  $("dataStatus").textContent = "กำลังโหลด";
  renderAll();
  const q = query(
    collection(db, "attendance"),
    where("date", "==", date),
    where("status", "==", "completed"),
    orderBy("checkOutTime", "desc"),
  );

  try {
    const snapshot = await getDocs(q);
    if (requestVersion !== completedRequestVersion || date !== currentDate || currentTab !== "completed") return;
    completedData = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    $("dataStatus").textContent = snapshot.metadata?.fromCache ? "ข้อมูลในเครื่อง · รอเชื่อมต่อ" : "ข้อมูลล่าสุดจาก server";
  } catch (error) {
    if (requestVersion === completedRequestVersion && date === currentDate) {
      completedError = true;
      $("dataStatus").textContent = "โหลดรายการไม่สำเร็จ";
      console.error("Completed list read failed", error);
    }
  } finally {
    if (requestVersion === completedRequestVersion) {
      completedLoading = false;
      renderAll();
    }
  }
}

function updateToggleSlider(
  tab
) {

  const slider =
    $("toggleSlider");

  slider.style.transform =
    tab === "active"
      ? "translateX(0%)"
      : "translateX(100%) translateX(-6%)";

  slider.style.background =
    tab === "active"
      ? "#4CAF50"
      : "#2196F3";

}

function bindToggleButtons() {

  document
    .querySelectorAll(
      ".toggle-btn"
    )
    .forEach((btn) => {

      btn.addEventListener(
        "click", 
        async () => {

        const tab = 
          btn.dataset.tab;

        await switchTab(tab);

      }
    );

  });

}

function bindSubjectButtons() {

  document
    .querySelectorAll(
      ".sub-btn"
    )
    .forEach((btn) => {

      btn.addEventListener(
        "click",
        () => {

          const subject =
            btn.dataset.subject;

          if (
            subject ===
            currentSubject
          ) {
            return;
          }

          currentSubject =
            subject;

          document
            .querySelectorAll(
              ".sub-btn"
            )
            .forEach((b) =>
              b.classList.remove(
                "active-sub"
              )
            );

          btn.classList.add(
            "active-sub"
          );

          if (
            currentTab !==
            "active"
          ) {
            return;
          }

          renderAll();

        }
      );

    });

}

async function switchTab(tab) {
  ensureResultDate();

  if (tab === currentTab) {
    if (tab === "completed" && completedError && !completedLoading) await loadCompleted();
    if (tab === "active" && activeListenerFailed) startListener();
    return;
  }

  currentTab = tab;
  completedRequestVersion++;
  completedLoading = false;
  document.querySelectorAll(".toggle-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });
  updateToggleSlider(tab);

  const isActive =
    tab === "active";

  $("subjectTabs").style.display =
    isActive 
      ? "" 
      : "none";

  if (isActive) {

    rebuildCheckinQueue();
    renderQueue();
    renderAll();
    startListener();

    return;

  } 

  if (unsubscribeListener) {

    unsubscribeListener();
    unsubscribeListener = null;

  }
  activeListenerVersion++;

  listenerInitialized = false;
  
  $("cardView").innerHTML = 
    "<p>กำลังโหลด...</p>";

  await loadCompleted(); 

}

window.checkout = async function (
  id
) {
  if (ensureResultDate()) return;
  if (checkoutState.loading.has(id) || checkoutState.pending.has(id)) return;

  const snapshot = activeDataAll.find(item => item.id === id);
  if (!snapshot) return;

  try { addPendingCheckout(id, snapshot.nickname); }
  catch (error) {
    alert("เก็บคิวในเครื่องไม่ได้ ยังไม่ได้เริ่ม checkout กรุณาตรวจสอบพื้นที่จัดเก็บของเบราว์เซอร์");
    return;
  }
  await processCheckout(id, snapshot);
};

window.retryCheckout = async function (id) {
  if (checkoutState.loading.has(id)) return;

  const entry = checkoutState.queue.get(id);
  if (!entry?.failed) return;

  entry.failed = false;
  const saved = checkoutStore.get(id);
  if (saved) checkoutStore.put({ ...saved, status: "pending" });
  renderAll();
  await processCheckout(id, entry.attendanceData);
};

async function processCheckout(id, attendanceData) {
  checkoutState.loading.add(id);
  const entry = checkoutState.queue.get(id);
  entry.attendanceData = attendanceData;
  let retryDelay = CHECKOUT_RETRY_DELAY_MS;

  try {
    while (true) {
      try {
        await checkoutAttendance({
          db,
          attendanceData,
          nowtime: entry.requestedAt,
        });
        break;
      } catch (error) {
        if (!isRetryableCheckoutError(error)) throw error;

        debugLog("CHECKOUT", "waiting to retry", { id, code: error.code });
        await waitForCheckoutRetry(retryDelay);
        retryDelay = Math.min(retryDelay * 2, CHECKOUT_MAX_RETRY_DELAY_MS);
      }
    }

    confirmCheckout(id);
    addRecentCheckout({
      nickname: attendanceData.nickname,
      subject: attendanceData.subject,
      time: new Date(),
    });
  } catch (error) {
    entry.failed = true;
    try {
      const saved = checkoutStore.get(id);
      if (saved) checkoutStore.put({ ...saved, status: "failed" });
    } catch (storageError) { console.error(storageError); }
    void logError(db, {
      tag: "CHECKOUT",
      message: error.message || "checkout failed",
      error,
      extra: {
        attendanceId: id,
        studentId: attendanceData.studentId,
        subject: attendanceData.subject,
        slotKey: attendanceData.slotKey,
        stage: "checkout-flow",
      },
    }).catch(console.error);
  } finally {
    checkoutState.loading.delete(id);
    renderAll();
  }

  if (checkoutState.confirmed.has(id) && currentTab === "completed") {
    try {
      await loadCompleted();
    } catch (error) {
      console.error("Completed list refresh failed", error);
    }
  }
}

function rebuildCheckinQueue() {

  activityState.checkinQueue = [];

  activeDataAll.forEach(item => {

    const minutes =
      getDiffMinutes(item.checkInTime);

    if (minutes < ACTIVITY_CONFIG.recentCheckinMinutes) {

      addRecentCheckin({
        nickname: item.nickname,
        subject: item.subject,
        time: item.checkInTime.toDate(),
      });

    }

  });

}

function startListener() {
  const version = ++activeListenerVersion;
  const date = currentDate;
  activeListenerFailed = false;
  $("dataStatus").textContent = "กำลังเชื่อมต่อ";

  if (unsubscribeListener) {

    unsubscribeListener();

    unsubscribeListener = 
      null;

  }

  // 🔹 query ของทุก active ทุกวิชา
  const qAll = query(
    collection(db, "attendance"),
    where("date", "==", currentDate),
    where("status", "==", "active"),
    orderBy("checkInTime", "asc"),
  );

  unsubscribeListener = 
    onSnapshot(qAll, { includeMetadataChanges: true }, (snapshot) => {
      if (version !== activeListenerVersion || date !== currentDate) return;
      const dataStatus = $("dataStatus");
      if (dataStatus) dataStatus.textContent = snapshot.metadata.fromCache ? "ข้อมูลในเครื่อง · รอเชื่อมต่อ" : "ข้อมูลล่าสุดจาก server";

      // รอบแรก ไม่ต้องแจ้งเตือน
      if (!listenerInitialized) {

        snapshot.forEach((docSnap) => {

          const data = docSnap.data();

          const minutes =
            getDiffMinutes(
              data.checkInTime
            );

          if (
            minutes <
            ACTIVITY_CONFIG.recentCheckinMinutes
          ) {

            addRecentCheckin({
              nickname: data.nickname,
              subject: data.subject,
              time: data.checkInTime.toDate(),
            });

          }

        });

      } else {

        snapshot.docChanges().forEach(change => {

          if (change.type !== "added")
            return;

          const data = change.doc.data();

          addRecentCheckin({
            nickname: data.nickname,
            subject: data.subject,
            time: data.checkInTime.toDate(),
          });

        });

      }

      activeDataAll = [];

      snapshot.forEach((docSnap) => {

        const data = docSnap.data();
        data.id = docSnap.id;

        activeDataAll.push(data);

      });

      listenerInitialized = true;

      reconcileConfirmedCheckouts(snapshot);

      renderAll();

  }, error => {
    if (version !== activeListenerVersion || date !== currentDate) return;
    activeListenerFailed = true;
    $("dataStatus").innerHTML = "โหลดข้อมูลไม่สำเร็จ <button type='button' class='retry-load'>ลองใหม่</button>";
    $("dataStatus").querySelector(".retry-load").onclick = () => startListener();
    console.error("Active list read failed", error);
  });

}

function renderAll() {

  cleanupActivityQueue();

  renderSummary();

  renderActiveControls();

  renderQueue();

  renderCardView();

}

function ensureResultDate() {
  const today = getTodayThai();
  if (today === currentDate) return false;
  currentDate = today;
  completedRequestVersion++;
  completedLoading = false;
  completedError = false;
  completedData = [];
  activeDataAll = [];
  activityState.checkinQueue = [];
  activityState.checkoutQueue = [];
  listenerInitialized = false;
  activeListenerVersion++;
  if (unsubscribeListener) unsubscribeListener();
  unsubscribeListener = null;
  $("dataStatus").textContent = "กำลังเชื่อมต่อ";
  if (currentTab === "active") startListener();
  else void loadCompleted();
  renderAll();
  return true;
}

document.addEventListener(
  "visibilitychange", 
  () => {

    if (document.visibilityState === "visible") {
      ensureResultDate();
      restorePendingCheckouts();

      if (currentTab === "active") {
        renderAll();
      }

    }

});
window.addEventListener("online", restorePendingCheckouts);
window.addEventListener("pageshow", ensureResultDate);
window.addEventListener("storage", event => {
  if (event.key?.startsWith(checkoutStore.prefix)) restorePendingCheckouts();
});

setInterval(() => {
  ensureResultDate();
  if (currentTab === "active") {
    renderAll();
  }
}, 60000);

</script>
